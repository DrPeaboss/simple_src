name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm adds a real-NEON aarch64 data point (free
        # GitHub-hosted runner for public repos).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run benches
        run: cargo bench -p simple_src
