[package]
name = "simple_src"
version = "0.5.0"
edition.workspace = true
authors = ["Peaboss <pea-boss@outlook.com>"]
license = "MIT"
readme = "../../README.md"
description = "A simple sample rate conversion lib for audio."
repository = "https://github.com/DrPeaboss/simple_src"
keywords = ["audio", "dsp", "sample-rate"]

[features]
# Internal hook to benchmark/test the scalar dot-kernel fallback.
internal-bench = []

[dependencies]
num-rational = { version = "0.4", default-features = false }

[dev-dependencies]
divan = "0.1"
hound = "3.5"

[[bench]]
name = "bench1"
harness = false
