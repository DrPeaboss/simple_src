name: Rust

on:
  push:
    branches: [ "main", "dev*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # arm64 labels are GitHub-hosted aarch64 runners (free for public
        # repos) with real NEON hardware; rust/rustup are preinstalled.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install fmt and clippy
      run: rustup component add rustfmt clippy
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Clippy (no default features)
      run: cargo clippy -p simple_src --no-default-features --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Test
      run: cargo test --verbose
    - name: Test (no default features)
      run: cargo test -p simple_src --no-default-features --lib --verbose
