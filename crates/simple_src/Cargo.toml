[package]
name = "simple_src"
version = "0.5.1"
edition.workspace = true
authors = ["Peaboss <pea-boss@outlook.com>"]
license = "MIT"
readme = "../../README.md"
description = "A simple sample rate conversion lib for audio."
repository = "https://github.com/DrPeaboss/simple_src"
keywords = ["audio", "dsp", "sample-rate"]

[features]
# RustFFT accelerates the measured-trim filter design. Disable default
# features to use the built-in hand-written radix-2 FFT instead.
default = ["rustfft"]
# Internal hook to benchmark/test the scalar dot-kernel fallback.
internal-bench = []
rustfft = ["dep:rustfft"]

[dependencies]
num-rational = { version = "0.4", default-features = false }
rustfft = { version = "6.4", optional = true }

[dev-dependencies]
# Benchmark harness. Lean feature set: no plotters/rayon (compile time), no
# HTML; the machine-readable results live in target/criterion/**/estimates.json
# and feed the local perf-baseline regression tooling. criterion 0.8 reads no
# Criterion.toml, so the sampling budget is set in benches/common/mod.rs.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Reads/writes the wav fixtures for tests and examples (supports 16/24/32-bit
# int and 32/64-bit float, including WAVE_FORMAT_EXTENSIBLE).
wavers = "1.5"
# Accelerates the FFT-based spectral baselines (tooling/report) and the
# quality-report example; the library's own trim design already uses rustfft
# behind the `rustfft` feature.
rustfft = "6.4"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "init"
harness = false

[[bench]]
name = "forced"
harness = false

[[bench]]
name = "trim_fft"
harness = false
